<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE9FA; --ink:#2A1740; --muted:#6B5A82; --surface:#FFFFFF; --line:#2A1740; --shadow:#2A1740;
  --coral:#FF6B81; --butter:#FFD76A; --mint:#86DDB8; --sky:#9CC0FF; --pink:#FFB3D1;
  --on:#2A1740; --paper:#FFF3CC;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand:"Caveat", "Bradley Hand", "Segoe Script", "Comic Sans MS", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191029; --ink:#F3EBFF; --muted:#B9A6D6; --surface:#2A1B42; --line:#CBB6F2; --shadow:#7A5FB0; --paper:#3A2A55;
  }
}
:root[data-theme="dark"]{
  --bg:#191029; --ink:#F3EBFF; --muted:#B9A6D6; --surface:#2A1B42; --line:#CBB6F2; --shadow:#7A5FB0; --paper:#3A2A55;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 64px}

/* top bar */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:760px;margin:0 auto}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:999px;text-decoration:none;font-weight:600;background:var(--surface)}
.bar h2{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}

/* hero */
.hero{padding:44px 0 26px}
.names{margin:0;font-size:clamp(3rem,13vw,6.6rem);line-height:.95;font-weight:800;letter-spacing:-.045em;font-variation-settings:"opsz" 96}
.amp{font-family:var(--hand);font-weight:700;letter-spacing:0;font-size:1.05em;color:var(--coral);padding:0 .08em}
.tag{margin:14px 0 0;font-size:1.25rem;color:var(--muted)}
.hero-row{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.heart{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1}
.heart:active{transform:scale(.9)}
.chip-days{padding:8px 16px;border:2px solid var(--line);border-radius:999px;font-weight:600;background:var(--butter);color:var(--on)}
.banner{margin-top:18px;padding:14px 18px;border:2px solid var(--line);border-radius:18px;background:var(--pink);color:var(--on);font-weight:600}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;grid-auto-flow:dense;margin-top:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:150px;padding:18px;text-align:left;text-decoration:none;background:var(--c);color:var(--on);border:2.5px solid var(--line);border-radius:26px 26px 26px 10px;box-shadow:5px 5px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
.tile:nth-child(even){border-radius:26px 26px 10px 26px}
.tile:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shadow)}
.tile:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--shadow)}
.tile .em{font-size:2rem;line-height:1}
.tile b{display:block;font-size:1.2rem;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.tile span.s{display:block;margin-top:4px;font-size:.92rem;opacity:.8}
.tile.wide{grid-column:span 2}
@media (min-width:700px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tile.wide{grid-column:span 2}
}

/* generic bits */
.lead{color:var(--muted);margin:6px 0 18px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.locked{opacity:.6;border-style:dashed}
.btn{min-height:48px;padding:0 22px;border:2.5px solid var(--line);border-radius:16px 16px 16px 6px;background:var(--coral);color:var(--on);font-weight:700;box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.panel{position:relative;background:var(--surface);border:2.5px solid var(--line);border-radius:26px 26px 26px 8px;padding:26px 22px 24px;box-shadow:5px 5px 0 var(--shadow);margin:18px 0}
.panel .kind{display:inline-block;font-weight:600;font-size:.95rem;color:var(--muted);margin-bottom:10px}
.panel .big{margin:0;font-size:clamp(1.55rem,5.4vw,2.2rem);line-height:1.2;font-weight:700;letter-spacing:-.02em}
.panel.note{background:var(--paper)}
.panel.hand .big{font-family:var(--hand);font-weight:700;font-size:clamp(1.9rem,6vw,2.5rem);line-height:1.15;letter-spacing:0}
.switch{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:500}
.switch input{width:22px;height:22px;accent-color:var(--coral)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.mode{min-height:84px;border:2.5px solid var(--line);border-radius:22px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;box-shadow:4px 4px 0 var(--shadow)}
.mode.truth{background:var(--sky);color:var(--on)}
.mode.dare{background:var(--coral);color:var(--on)}
.mode[aria-pressed="true"]{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow);outline:3px solid var(--ink);outline-offset:2px}

/* cards */
.deal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}
.pc{perspective:800px;aspect-ratio:2/3;background:none;border:0;padding:0}
.pc .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.pc.flipped .in{transform:rotateY(180deg)}
.pc.dim{opacity:.35}
.pc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2.5px solid var(--line);border-radius:12px;display:grid;place-items:center}
.pc .back{background-color:var(--deck,var(--coral));background-image:radial-gradient(circle,rgba(255,255,255,.55) 2px,transparent 2.6px);background-size:16px 16px}
.pc .front{background:var(--butter);color:var(--on);transform:rotateY(180deg);font-weight:800;font-size:clamp(1rem,4.5vw,1.6rem)}
.pc:not(.flipped):not([disabled]):hover .in{transform:translateY(-6px)}
details.kept{margin-top:26px}
details.kept summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.kept ul{padding-left:0;list-style:none;display:grid;gap:10px}
details.kept li{padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
details.kept small{color:var(--muted);display:block}

/* quiz */
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:52px;padding:10px 16px;border:2.5px solid var(--line);border-radius:16px;background:var(--surface);font-weight:500}
.opt i{font-style:normal;font-weight:800;width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.9rem}
.opt.correct{background:var(--mint);color:var(--on)}
.opt.wrong{background:var(--coral);color:var(--on);text-decoration:line-through}
.opt.correct i,.opt.wrong i{background:var(--on);color:#fff}
.verdict{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.progress{font-weight:600;color:var(--muted)}

/* letters */
.env-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px}
@media (min-width:700px){.env-grid{grid-template-columns:repeat(3,1fr)}}
.env{position:relative;min-height:120px;padding:16px 14px;text-align:left;border:2.5px solid var(--line);border-radius:10px 10px 22px 22px;background:var(--paper);box-shadow:4px 4px 0 var(--shadow);font-weight:600;line-height:1.25;overflow:hidden}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(to bottom right,transparent 49.5%,var(--line) 49.5%,var(--line) 51%,transparent 51%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,var(--line) 49.5%,var(--line) 51%,transparent 51%) right/50% 100% no-repeat;opacity:.5}
.env span{display:block;margin-top:48px}
.env.opened{opacity:.65}
.env.lock{border-style:dashed;background:var(--surface)}
.env.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* memories */
.timeline{list-style:none;margin:18px 0 0;padding:0 0 0 22px;border-left:3px solid var(--line)}
.timeline li{position:relative;margin:0 0 26px;padding-left:16px}
.timeline li::before{content:"";position:absolute;left:-33px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--coral);border:3px solid var(--line)}
.timeline time{font-weight:600;color:var(--muted);font-size:.95rem}
.timeline h3{margin:2px 0 4px;font-size:1.25rem;letter-spacing:-.01em}
.timeline p{margin:0;max-width:60ch}

/* together */
.tcard{background:var(--surface);border:2.5px solid var(--line);border-radius:22px;padding:20px;margin:18px 0;box-shadow:4px 4px 0 var(--shadow)}
.tcard h3{margin:0 0 10px;font-size:1.25rem;letter-spacing:-.01em}
.result{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-weight:600}
.result li{padding:10px 14px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.timer{font-size:3.6rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0}
.counter{display:flex;align-items:center;gap:16px}
.counter output{font-size:2.4rem;font-weight:800;min-width:2.4ch;text-align:center;font-variant-numeric:tabular-nums}
.round{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--line);background:var(--butter);color:var(--on);font-size:1.5rem;font-weight:800;line-height:1}

/* stats */
.ledger{list-style:none;margin:8px 0 0;padding:0;border:2.5px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:5px 5px 0 var(--shadow);overflow:hidden}
.ledger li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:14px 20px;border-top:2px dashed color-mix(in srgb,var(--line) 35%,transparent)}
.ledger li:first-child{border-top:0}
.ledger b{font-size:1.35rem;font-variant-numeric:tabular-nums;text-align:right}
.ledger .tap{cursor:pointer}
.reset{margin-top:28px;background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px}

/* overlay + toast + hearts */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,8,36,.6);display:grid;place-items:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);border:2.5px solid var(--line);border-radius:26px 26px 26px 8px;padding:26px 24px;box-shadow:6px 6px 0 var(--shadow)}
.sheet .title{font-weight:700;color:var(--muted);margin:0 0 8px}
.sheet .letter{font-family:var(--hand);font-size:clamp(1.7rem,5.6vw,2.2rem);line-height:1.2;margin:0 0 22px;white-space:pre-line}
#toast{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:none}
#toast span{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;max-width:420px;text-align:center}
.fly{position:fixed;bottom:-40px;z-index:25;pointer-events:none;animation:rise 2.4s ease-in forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(24deg);opacity:0}}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="bar"></div>
<div class="wrap"><main id="app"></main></div>
<div id="toast" role="status" aria-live="polite"><span></span></div>

<script>
/* ============================================================
   EDIT ME. Everything personal lives in this block.
   ============================================================ */
const CONFIG = {
  names: ["Alex", "Sam"],          // your names
  startDate: "2026-06-21",         // the day you got together (YYYY-MM-DD)
  unlockAfter: 10,                 // questions answered before the flirty stuff unlocks
  secret: "You found it.\nI hid this here in case you ever wondered whether I think about you when you're not around.\nI do.",
  milestoneNote: "Round numbers deserve a moment. Go find me and say hi.",

  // "How well do you know me?"  (a = index of the right answer, starting at 0)
  quiz: [
    {q:"What's my ideal date?", o:["Going somewhere new","Staying in and watching something","Going out with friends","Something completely spontaneous"], a:0,
      right:"Okay, you do know me.", wrong:"You really don't know me 😭", note:"But honestly, I would've accepted D."},
    {q:"What's my go-to comfort food?", o:["Pasta","Something fried","Anything sweet","Whatever you're having"], a:2,
      right:"Sugar. Obviously.", wrong:"Not even close.", note:"You will be making this up to me with dessert."},
    {q:"How do I recharge after a long day?", o:["Alone with music","A long call with a friend","A walk","Sleep, immediately"], a:0,
      right:"You get me.", wrong:"Ouch.", note:"Headphones in, world off."},
    {q:"What's my biggest pet peeve?", o:["Being late","Loud chewing","Unread messages","Slow walkers"], a:1,
      right:"Noted, and feared.", wrong:"You should know this by now.", note:"Yes, I'm serious."},
    {q:"Where would I live if I could live anywhere?", o:["A beach town","A huge city","The mountains","Wherever you are"], a:3,
      right:"Cheesy, but correct.", wrong:"Wrong, and a little heartbreaking.", note:"I meant it. Mostly."},
    {q:"What did I think the first time we met?", o:["Who is this?","Wow.","I hope they text me","I need snacks"], a:2,
      right:"You remembered.", wrong:"Nope.", note:"I checked my phone way too often that night."}
  ],

  // "Open when..."  (the last one stays locked until the anniversary)
  letters: [
    {t:"Open when you're sad", x:"Hey you.\nI'm sorry today is heavy. You don't have to fix it right now.\nPut the phone down, drink some water, breathe.\nWhatever it is, I'm on your side. Always."},
    {t:"Open when you miss me", x:"I miss you too. Probably right now, actually.\nLook at something we did together, then text me. I'll answer faster than usual."},
    {t:"Open when you're angry at me", x:"Okay. I probably deserve it.\nTake the time you need, then tell me exactly what I did. I'll listen properly.\nI'd rather be in an argument with you than fine without you."},
    {t:"Open when you can't sleep", x:"Close your eyes and picture the laziest Sunday we could have.\nNo alarms, no plans, me being annoying.\nNow sleep. I'm rooting for you."},
    {t:"Open when you need reassurance", x:"You are enough. You're more than enough.\nI chose you, and I'd choose you again on a bad day, a busy day, any day."},
    {t:"Open when you want to laugh", x:"Remember the time we couldn't stop laughing and had no idea why?\nThat. I want more of that.\n(Now go find a photo of my worst face and enjoy it.)"},
    {t:"Open when you want to know how much I love you", x:"More than I say out loud.\nMore than I know how to put in a letter.\nWrite the real version here."}
  ],
  lockedLetter: {t:"Open on our 1 year anniversary", x:"Happy one year.\nWrite the letter you want her to read on that day."},

  // "Our memories"
  memories: [
    {d:"2026-06-21", t:"The day it started", x:"Replace this with the story: where you were, what was said, what you remember most."},
    {d:"2026-07-04", t:"Our first real date", x:"What you ate, what went wrong, what went right."},
    {d:"2026-08-15", t:"The first trip", x:"A small detail only the two of you would remember."}
  ],

  // "Do something together"
  movies: ["The Princess Bride","Knives Out","Crazy, Stupid, Love","About Time","Paddington 2","Before Sunrise","Everything Everywhere All at Once","The Grand Budapest Hotel","Palm Springs","La La Land","10 Things I Hate About You","Coco","Ratatouille","Inception","Mamma Mia!","Little Miss Sunshine","Bridesmaids","Kiki's Delivery Service"],
  foods: ["🍝 Italian","🍣 Sushi","🌮 Tacos","🍛 Indian","🍜 Thai","🍔 Burgers","🍕 Pizza","🥟 Dim sum","🥩 Korean BBQ","🥞 Breakfast for dinner","🍜 Ramen","🥙 A street food crawl","🧑‍🍳 Cook something together","🍰 Dessert only"],
  places: ["A sunset walk somewhere neither of us has been","A bookshop, then a coffee","A day trip on a random train","A picnic at the nearest park","A museum we've never visited","A late-night drive with a shared playlist","Arcade or bowling","Stargazing with blankets","A market and a mystery-ingredient dinner","A pottery or painting class","A spa night at home"],

  // silly stats (numbers that you set yourself)
  silly: [
    {l:"Arguments over nothing", v:"∞"},
    {l:"Times you made me laugh", v:"???"},
    {l:"Times I was right", v:"87"}
  ],
  admitted: {l:"Times you admitted I was right", v:"0", secret:"1 (finally)"}
};

/* ============================================================
   CONTENT
   ============================================================ */
// ordered from light to deep, so "ease in" can start gentle
const Q = {
  us:[
    "What's a tiny thing I do that makes you feel loved?",
    "What's your favourite memory of us so far?",
    "What's something about us that you hope never changes?",
    "When did you first realize you felt differently about me?",
    "What's something we do together that you'd miss the most?",
    "What's something I've taught you without meaning to?",
    "When have you felt the closest to me?",
    "What do you think we're really good at as a couple?"],
  know:[
    "What's a small thing that instantly improves your day?",
    "What's something you've changed your mind about in the last year?",
    "What's a part of yourself you're still figuring out?",
    "What's something you wish people understood about you?",
    "What's a childhood memory you'd love to relive?",
    "What do you need more of in your life right now?",
    "What's something you're proud of that nobody notices?",
    "What's a fear you'd like to be braver about?"],
  deep:[
    "What does feeling at home mean to you?",
    "What does being understood mean to you?",
    "What's something you're afraid to lose?",
    "What's something you've never known how to ask for?",
    "What's a moment that changed how you see yourself?",
    "What would you tell yourself five years ago?",
    "What's something you hope I never stop doing?",
    "What do you want to be remembered for?"],
  silly:[
    "If we were both animals, what would we be?",
    "Who would survive longer in a zombie apocalypse?",
    "What's the dumbest thing we've ever argued about?",
    "What would be the most useless but funniest superpower to have?",
    "If we opened a business together, what would it be?",
    "What would our reality TV show be called?",
    "Which fictional couple are we most like, and who's the chaotic one?",
    "What's the most ridiculous rule we'd have in our dream house?"],
  flirty:[
    "What's something I do that you find ridiculously attractive?",
    "What's your favourite way for me to initiate affection?",
    "What's something you've wanted to do with me but haven't told me?",
    "What's the first thing you notice when I walk into a room?",
    "What's a moment recently when you couldn't stop smiling at me?",
    "What's something you'd love me to say to you more often?",
    "What's your favourite thing about the way I hold you?",
    "What would your ideal date night with me look like, start to finish?"],
  future:[
    "What would our perfect lazy Sunday look like?",
    "Where do you want us to travel together?",
    "What kind of life would you want us to have?",
    "What's one tradition you'd love us to start?",
    "What does our home look like in five years?",
    "What's something you want us to learn together?",
    "What's a dream you've never told me?",
    "What do you hope we're laughing about in ten years?"]
};
const QCATS = [
  {id:"us",e:"♡",n:"Us"},{id:"know",e:"🧠",n:"Get to know me"},{id:"deep",e:"🥹",n:"Deep"},
  {id:"silly",e:"🤪",n:"Stupid"},{id:"flirty",e:"🔥",n:"Flirty",lock:true},{id:"future",e:"🌱",n:"Future"},
  {id:"endless",e:"♾️",n:"Endless"},{id:"surprise",e:"✨",n:"Surprise me"}
];

// endless generator: each template only uses slots that always read naturally
const GEN = [
  {t:"What's your favourite {thing} from {time}?", s:{
    thing:["memory","moment","conversation","inside joke","thing we ate","thing we said"],
    time:["our first week together","our first trip","the last few months","the first time we met","a random ordinary day"]}},
  {t:"What's a {trait} of mine that you {feel}?", s:{
    trait:["habit","quirk","look","phrase"],
    feel:["secretly love","find ridiculously cute","would miss if it disappeared","hope I never lose"]}},
  {t:"If {when}, what would you want us to do first?", s:{
    when:["we had a free weekend with no plans","we could teleport anywhere tonight","we had one day with no phones","we won a surprise trip for two"]}},
  {t:"When did you last feel {feeling} with me?", s:{
    feeling:["completely relaxed","properly understood","ridiculously happy","safe","like we were the only two people around"]}},
  {t:"What's something small you'd like us to start doing {when}?", s:{
    when:["every week","every morning","before bed","whenever we travel","on Sundays"]}}
];

const TRUTHS = {

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };

function load(){ try{ const r = localStorage.getItem(KEY); return Object.assign(fresh(), r ? JSON.parse(r) : {}); }catch(e){ return fresh(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const start = new Date(CONFIG.startDate + "T00:00:00");
const days = () => Math.max(0, Math.floor((Date.now() - start) / 864e5));
const anniversary = () => { const d = new Date(start); d.setFullYear(d.getFullYear()+1); return d; };
const unlocked = () => S.answered >= CONFIG.unlockAfter;
const togo = () => Math.max(0, CONFIG.unlockAfter - S.answered);
const fmtDate = d => new Intl.DateTimeFormat(undefined,{day:"numeric",month:"long",year:"numeric"}).format(d);

let cleanups = [];
const onLeave = fn => cleanups.push(fn);

function toast(msg){
  const t = $("#toast"); t.firstElementChild.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2800);
}
function overlay(html){
  document.querySelector(".overlay")?.remove();
  const o = document.createElement("div");
  o.className = "overlay"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
  o.innerHTML = `<div class="sheet">${html}<button class="btn ghost close">Close</button></div>`;
  o.addEventListener("click", e => { if(e.target===o || e.target.classList.contains("close")) o.remove(); });
  document.body.appendChild(o); o.querySelector(".close").focus();
}
document.addEventListener("keydown", e => { if(e.key==="Escape") document.querySelector(".overlay")?.remove(); });
function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let i=0;i<26;i++){
    const s = document.createElement("span"); s.className="fly";
    s.textContent = pick(["❤️","💗","💖","💕","✨"]);
    s.style.left = Math.random()*100+"vw"; s.style.animationDelay = Math.random()*.6+"s";
    s.style.fontSize = (16+Math.random()*22)+"px";
    document.body.appendChild(s); setTimeout(()=>s.remove(), 3400);
  }
}
function checkUnlock(before){ if(before < CONFIG.unlockAfter && S.answered >= CONFIG.unlockAfter) toast("🔓 Something new just unlocked: the flirty stuff."); }

// prompt drawing
const seen = new Set();
function gen(){ const g = pick(GEN); return g.t.replace(/\{(\w+)\}/g, (_,k) => pick(g.s[k])); }
function fromList(list, size){
  const part = list.slice(0, size || list.length);
  let pool = part.filter(x => !seen.has(x));
  if(!pool.length){ part.forEach(x => seen.delete(x)); pool = part; }
  const t = pick(pool); seen.add(t); return t;
}
function drawQ(cat, ease){
  if(cat === "endless") return {t:gen(), cat:"endless"};
  if(cat === "surprise"){
    const pool = QCATS.filter(c => c.id!=="surprise" && !(c.lock && !unlocked()));
    return drawQ(pick(pool).id, ease);
  }
  const list = Q[cat];
  const size = ease ? Math.min(list.length, 3 + (S.byCat[cat]||0)) : list.length;
  return {t:fromList(list, size), cat};
}

function questions(el){

    <p class="lead">Pick a mood, get a question. There's always another one.</p>
    <div class="row" id="cats" role="group" aria-label="Categories"></div>

    <div id="out"></div>`;
  const cats = $("#cats"), out = $("#out");
  const drawChips = () => {
    cats.innerHTML = QCATS.map(c => {
      const lk = c.lock && !unlocked();
      return `<button class="chip ${lk?"locked":""}" data-c="${c.id}" aria-pressed="${c.id===cat}">${lk?"🔒":c.e} ${esc(c.n)}</button>`;
    }).join("");
  };
  const show = () => {
    const c = QCATS.find(x => x.id === cat);
    if(c.lock && !unlocked()){
      out.innerHTML = `<div class="panel note"><span class="kind">🔒 Locked for now</span><p class="big">Answer ${togo()} more question${togo()===1?"":"s"} to unlock this.</p></div>`;
      return;
    }
    cur = drawQ(cat, ease);
    const label = cur.cat==="endless" ? "♾️ Endless" : (QCATS.find(x=>x.id===cur.cat)||{}).e + " " + (QCATS.find(x=>x.id===cur.cat)||{}).n;

        <button class="btn" id="done">Answered, next</button>
        <button class="btn ghost" id="skip">Skip</button>
      </div>`;
    $("#done").onclick = () => {
      const before = S.answered; S.answered++; S.byCat[cur.cat] = (S.byCat[cur.cat]||0)+1; save();

/* ---------- truth or dare ---------- */
function tod(el){
  let mode = null, sub = null, cur = null;
  el.innerHTML = `
    <p class="lead">Choose one. Then choose how brave you're feeling.</p>
    <div class="two">
      <button class="mode truth" data-m="truth" aria-pressed="false">Truth</button>
      <button class="mode dare" data-m="dare" aria-pressed="false">Dare</button>
    </div>
    <div class="row" id="subs" role="group" aria-label="Flavour"></div>
    <div id="out"></div>`;
  const subs = $("#subs"), out = $("#out");
  const drawSubs = () => {
    if(!mode){ subs.innerHTML = ""; return; }
    const list = mode==="truth" ? TRUTH_SUBS : DARE_SUBS;
    subs.innerHTML = list.map(([id,n]) => {
      const lk = id==="flirty" && !unlocked();
      return `<button class="chip ${lk?"locked":""}" data-s="${id}" aria-pressed="${id===sub}">${lk?"🔒 ":""}${n}</button>`;
    }).join("");
  };
  const show = () => {
    if(!mode || !sub){ out.innerHTML = ""; return; }
    if(sub==="flirty" && !unlocked()){
      out.innerHTML = `<div class="panel note"><span class="kind">🔒 Locked for now</span><p class="big">Answer ${togo()} more question${togo()===1?"":"s"} in the Question Room or Truths to unlock this.</p></div>`;
      return;
    }
    const bank = (mode==="truth" ? TRUTHS : DARES)[sub];
    cur = fromList(bank);
    out.innerHTML = `
      <div class="panel"><span class="kind">${mode==="truth"?"Truth":"Dare"}</span><p class="big">${esc(cur)}</p></div>
      <div class="actions">
        <button class="btn" id="done">${mode==="truth"?"Answered":"Done"}</button>
        <button class="btn ghost" id="next">Another ${mode}</button>
      </div>`;
    $("#done").onclick = () => {
      const before = S.answered;
      if(mode==="truth"){ S.truths++; S.answered++; } else { S.dares++; }
      save(); checkUnlock(before); drawSubs(); show();
    };
    $("#next").onclick = show;
  };
  el.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.m; sub = (mode==="truth" ? TRUTH_SUBS : DARE_SUBS)[0][0];
    el.querySelectorAll(".mode").forEach(x => x.setAttribute("aria-pressed", x===b));
    drawSubs(); show();
  }));
  subs.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    sub = b.dataset.s; drawSubs(); show();
  });
}

/* ---------- pick a card ---------- */
function cards(el){
  let deck = DECKS[0];
  const dealt = {};   // per deck: set of seen indices
  el.innerHTML = `
    <p class="lead">Five cards, face down. Trust your gut.</p>
    <div class="row" id="decks" role="group" aria-label="Decks"></div>
    <div id="deal"></div>
    <div id="panel"></div>
    <details class="kept" id="kept"></details>`;
  const drawDecks = () => {
    $("#decks").innerHTML = DECKS.map(d => {
      const lk = d.lock && !unlocked();
      return `<button class="chip ${lk?"locked":""}" data-d="${d.id}" aria-pressed="${d.id===deck.id}">${lk?"🔒":d.e} ${esc(d.n)}</button>`;
    }).join("");
  };
  const drawKept = () => {
    const k = $("#kept");
    if(!S.kept.length){ k.style.display = "none"; return; }
    k.style.display = "";
    k.innerHTML = `<summary>Kept cards (${S.kept.length})</summary><ul>${S.kept.map(c => `<li><small>${esc(c.deck)}, card #${c.n}</small>${esc(c.t)}</li>`).join("")}</ul>`;
  };
  const deal = () => {
    $("#panel").innerHTML = "";
    if(deck.lock && !unlocked()){
      $("#deal").innerHTML = `<div class="panel note"><span class="kind">🔒 Locked for now</span><p class="big">Answer ${togo()} more question${togo()===1?"":"s"} to unlock this deck.</p></div>`;
      return;
    }
    const seenSet = dealt[deck.id] || (dealt[deck.id] = new Set());
    let idx = deck.cards.map((_,i)=>i).filter(i => !seenSet.has(i));
    if(idx.length < 5){ seenSet.clear(); idx = deck.cards.map((_,i)=>i); }
    const hand = shuffle(idx).slice(0,5);
    hand.forEach(i => seenSet.add(i));
    $("#deal").innerHTML = `<div class="deal" style="--deck:${deck.c}">${hand.map(i => `
      <button class="pc" data-i="${i}" aria-label="Face-down card"><span class="in"><span class="face back"></span><span class="face front">#${i+1}</span></span></button>`).join("")}</div>`;
    $("#deal").querySelectorAll(".pc").forEach(b => b.addEventListener("click", () => flip(b)));
  };
  const flip = b => {
    const i = +b.dataset.i, text = deck.cards[i];
    $("#deal").querySelectorAll(".pc").forEach(x => { x.disabled = true; if(x!==b) x.classList.add("dim"); });
    b.classList.add("flipped");
    $("#panel").innerHTML = `
      <div class="panel"><span class="kind">Card #${i+1}, ${esc(deck.n)}</span><p class="big">${esc(text)}</p></div>
      <div class="actions"><button class="btn" id="keep">Keep it</button><button class="btn ghost" id="nextc">Next card</button></div>`;
    $("#keep").onclick = () => {
      if(!S.kept.some(c => c.deck===deck.n && c.n===i+1)){ S.kept.push({deck:deck.n, n:i+1, t:text}); save(); drawKept(); toast("Kept."); }
      else toast("Already kept.");
    };
    $("#nextc").onclick = deal;
    $("#panel").scrollIntoView({behavior:"smooth", block:"nearest"});
  };
  $("#decks").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    deck = DECKS.find(d => d.id === b.dataset.d); drawDecks(); deal();
  });
  drawDecks(); drawKept(); deal();
}

/* ---------- quiz ---------- */
function quiz(el){
  const list = CONFIG.quiz;
  let i = 0, score = 0;
  const L = ["A","B","C","D","E","F"];
  const ask = () => {
    const q = list[i];
    el.innerHTML = `
      <p class="progress">Question ${i+1} of ${list.length}</p>
      <div class="panel"><p class="big">${esc(q.q)}</p></div>
      <div class="opts">${q.o.map((o,k) => `<button class="opt" data-k="${k}"><i>${L[k]}</i><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="res"></div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(+b.dataset.k)));
  };
  const answer = k => {
    const q = list[i], ok = k === q.a;
    if(ok) score++;
    el.querySelectorAll(".opt").forEach((b,n) => { b.disabled = true; if(n===q.a) b.classList.add("correct"); else if(n===k) b.classList.add("wrong"); });
    const last = i === list.length-1;
    $("#res").innerHTML = `
      <div class="panel ${ok?"":"note"}">
        <p class="verdict">${ok?"✅ Right":"❌ Wrong"}</p>
        <p style="margin:0 0 8px">${esc(ok?q.right:q.wrong)}</p>
        <p style="margin:0"><b>The answer was ${L[q.a]}.</b> ${esc(q.note||"")}</p>
      </div>
      <div class="actions"><button class="btn" id="nq">${last?"See my score":"Next question"}</button></div>`;
    $("#nq").onclick = () => { if(last) finish(); else { i++; ask(); } };
    $("#res").scrollIntoView({behavior:"smooth", block:"nearest"});
  };
  const finish = () => {
    if(score > S.quizBest){ S.quizBest = score; save(); }
    const f = score / list.length;
    const msg = f===1 ? "Perfect. Suspiciously perfect." : f>=.7 ? "Okay, you were paying attention." : f>=.4 ? "Not bad. Room to improve." : "We need to talk.";
    el.innerHTML = `
      <div class="panel"><span class="kind">Your score</span><p class="big">${score} out of ${list.length}</p><p style="margin:12px 0 0">${msg}</p></div>
      <div class="actions"><button class="btn" id="again">Try again</button><a class="btn ghost" style="display:inline-flex;align-items:center;text-decoration:none" href="#/">Home</a></div>`;
    $("#again").onclick = () => { i = 0; score = 0; ask(); };
  };
  ask();
}

function memories(el){
  el.innerHTML = `<p class="lead">The story so far.</p><ol class="timeline">${
    CONFIG.memories.map(m => `<li><time datetime="${esc(m.d)}">${esc(fmtDate(new Date(m.d+"T00:00:00")))}</time><h3>${esc(m.t)}</h3><p>${esc(m.x)}</p></li>`).join("")
  }</ol>`;
}

/* ---------- do something together ---------- */
function together(el){
  el.innerHTML = `
    <p class="lead">For when you'd rather do than read.</p>
    <div class="tcard"><h3>🎬 Pick a movie</h3><button class="btn" id="mv">Give us three</button><ul class="result" id="mvo"></ul></div>
    <div class="tcard"><h3>🍕 Pick our food</h3><button class="btn" id="fd">Decide for us</button><ul class="result" id="fdo"></ul></div>
    <div class="tcard"><h3>🌎 Pick a place</h3><button class="btn" id="pl">Surprise us</button><ul class="result" id="plo"></ul></div>
    <div class="tcard"><h3>💬 10-minute conversation</h3>
      <p id="tq" style="margin:0 0 6px;font-weight:600">Press start to get a question.</p>
      <div class="timer" id="tm" aria-live="off">10:00</div>
      <div class="actions" style="margin-top:8px"><button class="btn" id="ts">Start</button><button class="btn ghost" id="tr">New question</button></div>
    </div>
    <div class="tcard"><h3>Inside jokes recorded</h3>
      <div class="counter"><button class="round" id="jm" aria-label="One fewer">−</button><output id="jc">${S.jokes}</output><button class="round" id="jp" aria-label="One more">+</button></div>
    </div>`;
  const li = t => `<li>${esc(t)}</li>`;
  $("#mv").onclick = () => { $("#mvo").innerHTML = shuffle(CONFIG.movies).slice(0,3).map(li).join(""); };
  $("#fd").onclick = () => { $("#fdo").innerHTML = li(pick(CONFIG.foods)); $("#fd").textContent = "Try again"; };
  $("#pl").onclick = () => { $("#plo").innerHTML = li(pick(CONFIG.places)); $("#pl").textContent = "Try again"; };
  // timer
  let left = 600, iv = null;
  const paint = () => { $("#tm").textContent = String(Math.floor(left/60)).padStart(2,"0") + ":" + String(left%60).padStart(2,"0"); };
  const stop = () => { clearInterval(iv); iv = null; $("#ts").textContent = left===600 ? "Start" : "Resume"; };
  const newQ = () => { $("#tq").textContent = drawQ("surprise", false).t; };
  onLeave(() => clearInterval(iv));
  $("#ts").onclick = () => {
    if(iv){ stop(); return; }
    if(left===600 && $("#tq").textContent.startsWith("Press start")) newQ();
    if(left<=0){ left = 600; }
    $("#ts").textContent = "Pause";
    iv = setInterval(() => {
      left--; paint();
      if(left<=0){ clearInterval(iv); iv = null; $("#ts").textContent = "Start"; left = 600; $("#tm").textContent = "Time's up"; toast("Time's up. Keep talking if you don't want to stop."); }
    }, 1000);
  };
  $("#tr").onclick = () => { newQ(); if(iv){ clearInterval(iv); iv = null; } left = 600; paint(); $("#ts").textContent = "Start"; };
  const jokes = d => { S.jokes = Math.max(0, S.jokes + d); save(); $("#jc").textContent = S.jokes; };
  $("#jp").onclick = () => jokes(1); $("#jm").onclick = () => jokes(-1);
}

/* ---------- random ---------- */
function random(el){
  const one = () => {
    const locked = !unlocked();
    const kinds = [
      () => ({k:"Question", t:drawQ("surprise", false).t}),
      () => { const s = pick(TRUTH_SUBS.filter(x => !(locked && x[0]==="flirty")))[0]; return {k:"Truth", t:pick(TRUTHS[s])}; },
      () => { const s = pick(DARE_SUBS.filter(x => !(locked && x[0]==="flirty")))[0]; return {k:"Dare", t:pick(DARES[s])}; },
      () => { const d = pick(DECKS.filter(x => !(locked && x.lock))); return {k:"Card, " + d.n, t:pick(d.cards)}; }
    ];
    return pick(kinds)();
  };
  const show = () => {
    const r = one();
    el.innerHTML = `<p class="lead">No choices. Whatever comes up, comes up.</p>
      <div class="panel"><span class="kind">${esc(r.k)}</span><p class="big">${esc(r.t)}</p></div>
      <div class="actions"><button class="btn" id="ag">Again</button></div>`;
    $("#ag").onclick = show;
  };
  show();
}

/* ---------- stats ---------- */
function stats(el){
  const rows = [
    ["Days together", days()],
    ["Questions answered", S.answered],
    ["Truths survived", S.truths],
    ["Dares completed", S.dares],
    ["Cards kept", S.kept.length],
    ["Letters opened", S.opened.length],
    ["Best quiz score", `${S.quizBest} / ${CONFIG.quiz.length}`],
    ["Inside jokes recorded", S.jokes]
  ];
  el.innerHTML = `
    <p class="lead">Numbers that don't matter, kept very carefully.</p>
    <ul class="ledger">
      ${rows.map(r => `<li><span>${esc(r[0])}</span><b>${esc(r[1])}</b></li>`).join("")}
      ${CONFIG.silly.map(r => `<li><span>${esc(r.l)}</span><b>${esc(r.v)}</b></li>`).join("")}
      <li class="tap" id="adm"><span>${esc(CONFIG.admitted.l)}</span><b id="admv">${esc(CONFIG.admitted.v)}</b></li>
    </ul>
    <button class="reset" id="rs">Reset our counts</button>`;
  let taps = 0;
  $("#adm").addEventListener("click", () => {
    taps++; if(taps >= 3){ $("#admv").textContent = CONFIG.admitted.secret; burst(); }
  });
  $("#rs").onclick = () => { if(confirm("Reset all counts, kept cards and opened letters on this device?")){ S = fresh(); save(); stats(el); } };
}

route();
</script>
</body>
</html>
