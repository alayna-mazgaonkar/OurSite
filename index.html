<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Pixelify+Sans:wght@400..700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* light = manga page */
  --bg:#EEE5F2; --panel:#FBF7FD; --ink:#180A2B; --muted:#5E4A7A; --line:#180A2B; --shadow:#7D1029;
  --red:#A8122F; --red2:#6E0E24; --purple:#4E20A0; --purple2:#3A1878; --on:#FFFFFF;
  --dot:rgba(24,10,43,.11);
  --display:"Pixelify Sans", "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  --font:"Chakra Petch", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    /* dark = arcade cabinet */
    --bg:#0E0418; --panel:#1B0A30; --ink:#F6EAFF; --muted:#B49AD6; --line:#B58CFF; --shadow:#C4173F;
    --red:#C4173F; --red2:#8E1030; --purple:#6D33D6; --purple2:#3F1B87; --dot:rgba(181,140,255,.09);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0418; --panel:#1B0A30; --ink:#F6EAFF; --muted:#B49AD6; --line:#B58CFF; --shadow:#C4173F;
  --red:#C4173F; --red2:#8E1030; --purple:#6D33D6; --purple2:#3F1B87; --dot:rgba(181,140,255,.09);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.7px);background-size:9px 9px;color:var(--ink);font-family:var(--font);font-weight:500;font-size:17px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 72px}
svg{image-rendering:pixelated}

/* top bar */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--line)}
#bar:empty{display:none}
.bar{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:760px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 12px;border:3px solid var(--line);background:var(--panel);text-decoration:none;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.back::before{content:"";border:6px solid transparent;border-right:9px solid currentColor;border-left:0}
.bar h2{margin:0;font:700 1.25rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em}

/* home */
.hud{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;padding:14px 0}
.hud .lives{display:flex;align-items:center;gap:10px}
.hbtn{background:none;border:0;padding:10px;margin:-10px 0;line-height:0}
.stage{position:relative;width:min(270px,100%);height:262px;margin:0 auto;border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);background:var(--purple2);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:12px}
.stage::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,255,255,.17) 0 1.4deg,transparent 1.4deg 7deg);-webkit-mask-image:radial-gradient(circle at 50% 55%,transparent 0,transparent 55px,#000 160px);mask-image:radial-gradient(circle at 50% 55%,transparent 0,transparent 55px,#000 160px)}
.stage>*{position:relative;z-index:1}
.pet{background:none;border:0;padding:0;line-height:0}
.pet svg{display:block}
.pet.on svg{animation:squish .36s steps(3)}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes squish{30%{transform:scale(1.08,.9)}70%{transform:scale(.95,1.06)}}
.bubble{position:absolute;z-index:2;top:22px;right:9%;background:#fff;color:#180A2B;border:3px solid #180A2B;padding:2px 12px;font-family:var(--display);font-weight:700;font-size:1.1rem;opacity:0;transform:translateY(6px);transition:opacity .1s,transform .1s}
.bubble.on{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;left:14px;bottom:-15px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid #180A2B}
.hp{position:absolute;bottom:52%;z-index:3;pointer-events:none;animation:hp 1.2s steps(10) forwards}
@keyframes hp{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),-130px);opacity:0}}
.names{margin:30px 0 0;font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,12vw,5.2rem);line-height:.98;text-transform:uppercase;letter-spacing:.02em;text-shadow:4px 4px 0 var(--red)}
.names .amp{color:var(--red);text-shadow:4px 4px 0 var(--ink)}
.tag{margin:14px 0 0;font-size:1.2rem;color:var(--muted)}
.sel{margin:26px 0 12px;font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.cursor{display:inline-block;width:.6em;height:1em;margin-left:8px;background:var(--red);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.banner{margin:0 0 18px;padding:14px 18px;border:3px solid var(--line);background:var(--red);color:var(--on);font-weight:700;box-shadow:5px 5px 0 var(--line)}
.menu{list-style:none;margin:0;padding:0;border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);background:var(--panel)}
.menu li+li{border-top:3px solid var(--line)}
.menu li:nth-child(even) a{background:color-mix(in srgb,var(--purple) 11%,var(--panel))}
.menu a{position:relative;display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;min-height:62px;padding:12px 16px 12px 20px;text-decoration:none}
.menu .n{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--muted)}
.menu b{display:block;font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.1;text-transform:uppercase;letter-spacing:.03em}
.menu small{display:block;font-size:.92rem;color:var(--muted)}
.menu a::before{content:"";position:absolute;left:4px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:9px solid var(--on);border-right:0;opacity:0}
.menu a:hover,.menu a:focus-visible{background:var(--red);color:var(--on)}
.menu a:hover .n,.menu a:hover small,.menu a:focus-visible .n,.menu a:focus-visible small{color:inherit;opacity:.9}
.menu a:hover::before,.menu a:focus-visible::before{opacity:1}

/* shared */
.lead{color:var(--muted);margin:18px 0 8px}
.step{margin:24px 0 8px;font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{min-height:44px;padding:0 14px;border:3px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chip[aria-pressed="true"]{background:var(--purple);color:var(--on)}
.chip.locked{border-style:dashed;color:var(--muted)}
.chip small{font:inherit;opacity:.7;margin-left:6px}
.btn{min-height:48px;padding:0 22px;border:3px solid var(--line);background:var(--red);color:var(--on);font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;box-shadow:4px 4px 0 var(--line)}
.btn.alt{background:var(--purple)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn.xl{min-height:64px;font-size:1.4rem;padding:0 30px}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
.panel{position:relative;background:var(--panel);border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);padding:30px 20px 22px;margin:28px 0 20px}
.tab{position:absolute;top:-16px;left:14px;max-width:calc(100% - 28px);padding:1px 10px;background:var(--red);color:var(--on);border:3px solid var(--line);font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase}
.big{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,5.6vw,2.15rem);line-height:1.2;letter-spacing:.005em}
.panel p.sub{margin:12px 0 0;color:var(--muted)}
.switch{display:flex;align-items:center;gap:12px;margin:12px 0;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.mode{min-height:88px;border:3px solid var(--line);color:var(--on);font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.06em;text-transform:uppercase;box-shadow:5px 5px 0 var(--line)}
.mode.truth{background:var(--purple)}
.mode.dare{background:var(--red)}
.mode:active:not([disabled]){transform:translate(5px,5px);box-shadow:0 0 0 var(--line)}
.mode[disabled]{opacity:.4;cursor:default;box-shadow:none}

/* cards */
.deal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0}
.pc{perspective:800px;aspect-ratio:2/3;background:none;border:0;padding:0}
.pc .in{position:relative;display:block;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.pc.flipped .in{transform:rotateY(180deg)}
.pc.dim{opacity:.35}
.pc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--line);display:grid;place-items:center}
.pc .back{background-color:var(--deck,var(--red));background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 3px,transparent 3px 10px)}
.pc .front{background:var(--panel);color:var(--ink);transform:rotateY(180deg);font-family:var(--display);font-weight:700;font-size:clamp(1rem,4.5vw,1.6rem)}
.pc:not(.flipped):not([disabled]):hover .in{transform:translateY(-6px)}
details.kept{margin-top:28px}
details.kept summary{cursor:pointer;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;min-height:44px;display:flex;align-items:center}
details.kept ul{padding:0;list-style:none;display:grid;gap:10px}
details.kept li{padding:12px 14px;border:3px solid var(--line);background:var(--panel)}
details.kept small{display:block;color:var(--muted)}

/* quiz */
.score{display:flex;justify-content:space-between;gap:12px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.score span{padding:4px 12px;border:3px solid var(--line);background:var(--panel)}
.score span.on{background:var(--purple);color:var(--on)}
.opts{display:grid;gap:12px;margin-top:20px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;min-height:54px;padding:8px 14px;border:3px solid var(--line);background:var(--panel);font-weight:600}
.opt i{font-style:normal;font-family:var(--display);font-weight:700;width:30px;height:30px;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.opt.picked{background:var(--purple);color:var(--on)}
.opt.correct{background:var(--purple);color:var(--on)}
.opt.wrong{background:var(--red);color:var(--on);text-decoration:line-through}
.opt.correct i,.opt.wrong i,.opt.picked i{background:var(--on);color:#180A2B}
.verdict{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:1.8rem;text-transform:uppercase;letter-spacing:.03em}

/* letters */
.env-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px}
@media (min-width:700px){.env-grid{grid-template-columns:repeat(3,1fr)}}
.env{position:relative;min-height:124px;padding:0;text-align:left;border:3px solid var(--line);background:var(--panel);box-shadow:5px 5px 0 var(--shadow);overflow:hidden}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:48px;background:linear-gradient(to bottom right,transparent calc(50% - 1.5px),var(--line) calc(50% - 1.5px),var(--line) calc(50% + 1.5px),transparent calc(50% + 1.5px)) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent calc(50% - 1.5px),var(--line) calc(50% - 1.5px),var(--line) calc(50% + 1.5px),transparent calc(50% + 1.5px)) right/50% 100% no-repeat}
.env span{display:block;padding:58px 12px 12px;font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2;text-transform:uppercase}
.env.opened{background:color-mix(in srgb,var(--purple) 16%,var(--panel))}
.env.lock{border-style:dashed}
.env.lock span::after{content:"Locked";display:inline-block;margin-left:8px;padding:0 6px;background:var(--red);color:var(--on);font-size:.8rem;vertical-align:.1em}
.env.shake{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* memories */
.timeline{list-style:none;margin:18px 0 0;padding:0 0 0 24px;border-left:4px solid var(--line)}
.timeline li{position:relative;margin:0 0 28px;padding-left:16px}
.timeline li::before{content:"";position:absolute;left:-36px;top:5px;width:16px;height:16px;background:var(--red);border:3px solid var(--line)}
.timeline time{font-family:var(--display);font-weight:600;color:var(--muted);letter-spacing:.04em}
.timeline h3{margin:2px 0 4px;font-family:var(--display);font-weight:700;font-size:1.4rem;text-transform:uppercase;letter-spacing:.02em}
.timeline p{margin:0;max-width:60ch}

/* together, chaos */
.tcard{position:relative;background:var(--panel);border:3px solid var(--line);padding:26px 20px 20px;margin:28px 0;box-shadow:6px 6px 0 var(--shadow)}
.result{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-weight:700}
.result li{padding:10px 14px;border:3px solid var(--line);background:var(--bg)}
.result small{display:block;font-weight:500;color:var(--muted)}
.timer{font-family:var(--display);font-weight:700;font-size:3.6rem;line-height:1.1;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:8px 0 0}

/* heads up */
.hu-top{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:1.3rem;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 12px}
.hu-word{display:grid;place-items:center;text-align:center;min-height:40vh;padding:24px;border:3px solid var(--line);background:var(--red);color:var(--on);box-shadow:6px 6px 0 var(--shadow);font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,11vw,4.4rem);line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.hu-word.ok{background:var(--purple)}
.hu-btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.hu-btns .btn{min-height:76px;font-size:1.5rem}
.count{display:grid;place-items:center;min-height:50vh;font-family:var(--display);font-weight:700;font-size:8rem;text-shadow:5px 5px 0 var(--red)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two-col ul{margin:8px 0 0;padding-left:18px}

/* witch's hut */
.scene{border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);background:#1B0A30;display:grid;place-items:center;padding:16px}
.scene svg{width:min(340px,100%);height:auto}
.tarot-wrap{display:grid;place-items:center;margin:20px 0 8px}
.t3{width:min(220px,66vw);aspect-ratio:2/3;perspective:900px}
.t3 .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s}
.t3.flipped .in{transform:rotateY(180deg)}
.t3 .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.t3 .back{background-color:var(--purple);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 4px,transparent 4px 12px);color:var(--on)}
.t3 .front{transform:rotateY(180deg);background:#F4EEFF;color:#180A2B;box-shadow:inset 0 0 0 5px #F4EEFF,inset 0 0 0 8px #A8122F}
.t3 .num{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.1em}
.t3 .nm{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.1;text-transform:uppercase}
.t3.rev .art{transform:rotate(180deg)}
.rev-tag{display:inline-block;background:var(--red);color:var(--on);padding:0 8px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ball{position:relative;width:190px;height:190px;border-radius:50%;background:#0B0314;border:3px solid var(--line);display:grid;place-items:center;margin:14px auto;box-shadow:6px 6px 0 var(--shadow)}
.ball::before{content:"";position:absolute;left:34px;top:24px;width:36px;height:16px;background:rgba(255,255,255,.2);border-radius:50%;transform:rotate(-30deg)}
.ball .win{width:104px;height:100px;background:var(--purple);clip-path:polygon(50% 4%,98% 94%,2% 94%);display:grid;place-items:center;padding-top:34px;text-align:center;color:var(--on);font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.05}
.ball.eight .win{font-size:2.2rem;padding-top:26px}
.ball.shake{animation:ballshake .7s steps(7)}
@keyframes ballshake{15%{transform:translate(-10px,4px) rotate(-6deg)}35%{transform:translate(10px,-4px) rotate(6deg)}55%{transform:translate(-8px,-3px) rotate(-4deg)}75%{transform:translate(8px,3px) rotate(4deg)}}
.zzz{position:absolute;right:16%;top:20px;color:#fff;font-family:var(--display);font-weight:700;font-size:1.4rem;animation:zzz 2.4s steps(6) infinite}
.zzz.b{right:9%;top:38px;font-size:1rem;animation-delay:1.1s}
@keyframes zzz{0%{opacity:0;transform:translateY(12px)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* stats */
.ledger{list-style:none;margin:10px 0 0;padding:0;border:3px solid var(--line);background:var(--panel);box-shadow:6px 6px 0 var(--shadow)}
.ledger li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:14px 20px}
.ledger li+li{border-top:3px dashed color-mix(in srgb,var(--line) 45%,transparent)}
.ledger b{font-family:var(--display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;text-align:right}
.ledger .tap{cursor:pointer}
.reset{margin-top:28px;background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px}

/* dialog, toast */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,2,20,.7);display:grid;place-items:center;padding:20px;padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet{position:relative;width:min(580px,100%);max-height:100%;overflow:auto;background:var(--panel);border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);padding:34px 22px 22px}
.letter{margin:0 0 22px;white-space:pre-line;font-family:var(--display);font-weight:500;font-size:1.4rem;line-height:1.35}
.letter .rest{visibility:hidden}
#toast{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .15s,transform .15s}
#toast.on{opacity:1;transform:none}
#toast span{background:var(--red);color:var(--on);border:3px solid var(--line);padding:10px 16px;font-family:var(--display);font-weight:600;max-width:440px;text-align:center}
.fly{position:fixed;bottom:-40px;z-index:25;pointer-events:none;animation:rise 2.4s steps(24) forwards;line-height:0}
@keyframes rise{to{transform:translateY(-115vh);opacity:0}}
/* ---- v3 additions ---- */
#app{position:relative}
.btn.sm{min-height:40px;padding:0 16px;font-size:.95rem}
.more{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mt{display:flex;flex-direction:column;text-decoration:none;border:3px solid var(--line);background:var(--panel);box-shadow:5px 5px 0 var(--shadow)}
.mt .ic{display:grid;place-items:center;min-height:104px;background:var(--purple2);border-bottom:3px solid var(--line)}
.mt .ic svg{max-width:100%;height:auto}
.mt b{display:block;flex:1;padding:10px 12px;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.15;text-transform:uppercase;letter-spacing:.03em}
.mt:hover,.mt:focus-visible{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shadow)}
.mt:hover b,.mt:focus-visible b{background:var(--red);color:var(--on)}
.keyi{display:inline-flex;margin-left:6px;line-height:0}

/* record player */
.gwrap{display:grid;place-items:center;background:var(--purple2);border:3px solid var(--line);padding:18px 10px 10px;margin-top:4px}
.gs{position:relative;width:fit-content;max-width:100%;line-height:0}
.spin{position:absolute;top:calc(63% - 3px);left:28%;width:9px;height:6px;background:#fff;opacity:0}
.gs.on .spin{opacity:1;animation:orbit 1.1s steps(14) infinite}
@keyframes orbit{0%{left:28%}50%{left:66%}100%{left:28%}}
.nt{position:absolute;left:14%;top:16%;line-height:0;pointer-events:none;animation:note 2s steps(14) forwards}
@keyframes note{to{transform:translate(var(--dx),-70px);opacity:0}}
.now{margin:16px 0 0;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tracks{list-style:none;margin:12px 0 0;padding:0;border:3px solid var(--line)}
.tracks li+li{border-top:3px solid var(--line)}
.track{display:grid;grid-template-columns:34px 1fr;align-items:center;width:100%;min-height:54px;padding:8px 12px;text-align:left;background:var(--panel);border:0}
.track .tn{font-family:var(--display);font-weight:700;color:var(--muted)}
.track .tt{font-weight:700}
.track small{display:block;font-weight:500;color:var(--muted)}
.track.on{background:var(--red);color:var(--on)}
.track.on small,.track.on .tn{color:inherit}
.gact a.btn{display:inline-flex;align-items:center;text-decoration:none}

/* snake */
.snb{position:relative;display:grid;place-items:end center;min-height:260px;background:var(--purple2);border:3px solid var(--line);padding:70px 10px 14px;margin-top:4px}
.snb .bubble{top:14px;left:12px;right:auto}
.paper{position:absolute;right:8px;top:8px;z-index:4;width:min(240px,64%);padding:10px 12px;background:#F4EEFF;color:#180A2B;border:3px solid #180A2B;box-shadow:4px 4px 0 rgba(0,0,0,.4);font-family:var(--display);font-weight:600;line-height:1.2;transform:rotate(-3deg)}
.paper b{display:block;margin-bottom:4px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#A8122F}
.paper.pop{animation:ppop .5s steps(6)}
@keyframes ppop{from{transform:translate(-50px,70px) rotate(-30deg) scale(.3);opacity:0}to{transform:rotate(-3deg);opacity:1}}

/* nook: door + mushroom */
.nook{display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px;padding:0 8px}
.doorw{display:flex;flex-direction:column;align-items:center;gap:4px}
.door{background:none;border:0;padding:6px;line-height:0}
.door.shake{animation:shake .4s steps(4)}
.door.glint svg{animation:glint 1.4s steps(2) infinite}
@keyframes glint{50%{filter:brightness(1.6)}}
.dlab{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mushw{position:relative}
.mush{background:none;border:0;padding:8px;line-height:0}
.mush.wob svg{animation:wob .35s steps(4)}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.mushw .bubble{top:-36px;right:-6px;left:auto;white-space:nowrap;font-size:.95rem}

/* footer */
.foot{margin-top:48px;text-align:center}
.sky{display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:34px 10px 18px;background:var(--purple2);border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}
.sky .st{align-self:flex-start;animation:twinkle 1.6s steps(2) infinite}
@keyframes twinkle{50%{opacity:.35}}
.foot p{margin:18px 0 0;font-family:var(--display);font-weight:600;font-size:1.3rem;letter-spacing:.04em}

/* wandering cat */
.wcat{position:absolute;left:0;top:0;z-index:4;width:64px;height:56px;padding:0;border:0;background:none;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;transition:transform 1s linear;will-change:transform}
.wcat .csp{display:block;line-height:0;filter:drop-shadow(1.5px 0 0 var(--line)) drop-shadow(-1.5px 0 0 var(--line)) drop-shadow(0 1.5px 0 var(--line)) drop-shadow(0 -1.5px 0 var(--line))}
.wcat .zz{position:absolute;top:-4px;right:2px;display:none;font-family:var(--display);font-weight:700;color:var(--ink);animation:zzz 2.4s steps(6) infinite}
.wcat .cb{top:-34px;left:50%;right:auto;font-size:.9rem;white-space:nowrap;transform:translateX(-50%)}
.wcat .cb.on{transform:translateX(-50%)}

/* fantasy quiz result */
.res h3{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1.1;text-transform:uppercase}
.res p{margin:0}
.result li.emo{font-size:2.4rem;text-align:center;line-height:1.2}

/* the door room */
body.hush{background:#1A0E22;background-image:none;color:#F7E9E4}
.hushpage{min-height:82vh;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:64px 4px;text-align:center;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(1.5rem,5.4vw,2.1rem);line-height:1.3}
.hushpage p{margin:0}
.hl{opacity:0;animation:hfade 1.8s ease forwards}
@keyframes hfade{to{opacity:1}}
.hushpage .msg{font-style:italic;color:#F3C9D2}
.hphoto img{max-width:100%;border:10px solid #F7E9E4;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hlink,.hback{display:inline-block;align-self:center;padding:12px 26px;border:2px solid #F7E9E4;color:#F7E9E4;text-decoration:none;font-size:1.2rem;font-style:italic}
.hlink:hover,.hback:hover{background:#F7E9E4;color:#1A0E22}

.t3 .face{gap:8px}
.t3 .art{display:block;width:100%}
.t3 .art svg{display:block;width:100%;height:auto;border:2px solid #180A2B}
/* ---- v4 ---- */
body{overflow-x:clip}
.bubble{pointer-events:none}
.pet svg{display:block}
.perch{position:relative;height:128px;margin-top:6px;display:flex;align-items:flex-end}
.bwrap{position:absolute;right:calc(50% - 50vw);top:0;width:190px;height:112px}
.bwrap .br{position:absolute;left:0;top:38px;line-height:0}
.bwrap .bird{position:absolute;left:66px;top:0;background:none;border:0;padding:0;line-height:0}
.bird.hop{animation:hop .4s steps(4)}
@keyframes hop{40%{transform:translateY(-9px)}}
.bwrap .bubble{top:-8px;left:-6px;right:auto}
.abanner{margin:14px 0 0;padding:12px 14px;background:var(--red);color:var(--on);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line);text-align:center;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em}
.abanner .ar{display:flex;align-items:center;justify-content:center;gap:14px}
.abanner b{display:block;font-size:1.3rem;font-weight:700}
.abanner small{display:block;margin-top:2px;font-family:var(--font);font-size:.8rem;font-weight:500;letter-spacing:0;text-transform:none;opacity:.9}
.abanner svg{flex:none;animation:twinkle 1.2s steps(2) infinite}
.skywrap{position:relative}
.snkrow{position:absolute;right:7%;bottom:100%;margin-bottom:-3px;z-index:2;display:flex;align-items:flex-end;gap:10px}
.snkrow .btn.sm{margin-bottom:6px}
.pet.snake{background:none;border:0;padding:0;line-height:0;transform-origin:15% 100%;animation:sway 3.2s steps(6) infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.snkrow .bubble{top:-26px;right:8px;left:auto;white-space:nowrap}
.snkrow .paper{top:auto;right:0;bottom:calc(100% + 10px);width:min(230px,80vw)}
.ytbox{position:relative;padding-top:56.25%;margin-top:14px;border:3px solid var(--line);background:#000}
.ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hlink{background:none;cursor:pointer}
.vidsheet{padding:14px 14px 18px;background:#000}
.vidsheet video{display:block;width:100%;max-height:68vh;margin-bottom:14px;background:#000}
/* ---- v6 ---- */
#np{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:6px 8px 6px 12px;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
#np[hidden]{display:none}
#npi{line-height:0;flex:none}
#nptitle{font-family:var(--display);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keyfx{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;background:rgba(10,2,20,.35);animation:kfade 3.6s steps(36) forwards}
@keyframes kfade{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
.kbox{position:relative;line-height:0;padding:34px 44px;animation:kpop 3.6s steps(36) forwards}
.kbox>svg{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.55))}
@keyframes kpop{0%{transform:scale(.2) rotate(-25deg)}8%{transform:scale(1.25) rotate(8deg)}16%{transform:scale(1) rotate(0)}30%{transform:rotate(-8deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(0) translateY(-6px)}100%{transform:translateY(-40px) scale(.85)}}
.ksp{position:absolute;line-height:0;animation:twinkle .55s steps(2) infinite}
.pc .face{border:0;background:none;padding:0}
.pc .face svg{width:100%!important;height:auto;display:block}
@media (prefers-reduced-motion: reduce){
  .keyfx{animation:none;opacity:1}
  .kbox{animation:none}
  .hl{opacity:1!important}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

function sprite(rows, px, cls){
  const h = rows.length, w = rows[0].length; let r = "";
  for(let y=0;y<h;y++){
    let x = 0;
    while(x<w){
      const c = rows[y][x];
      if(c==="." || !PAL[c]){ x++; continue; }
      let e = x; while(e<w && rows[y][e]===c) e++;
      r += `<rect x="${x}" y="${y}" width="${e-x}" height="1.02" fill="${PAL[c]}"/>`;
      x = e;
    }
  }
  return `<svg class="${cls||""}" viewBox="0 0 ${w} ${h}" style="width:${w*px}px;max-width:100%;height:auto" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

const PL = {i:-1, playing:false, failed:false, stopFn:null, ui:null};
function updatePill(){
  const np = $("#np"); if(!np) return;
  const on = PL.i >= 0 && PL.playing;
  np.hidden = !on;
  if(on) $("#nptitle").textContent = CONFIG.songs[PL.i].t;
}
function stopSong(){
  if(PL.stopFn){ try{ PL.stopFn(); }catch(e){} PL.stopFn = null; }
  PL.i = -1; PL.playing = false; PL.failed = false; updatePill(); if(PL.ui) PL.ui();
}
function playSong(i){
  stopSong();
  const s = CONFIG.songs[i]; PL.i = i; PL.failed = false;
  const poke = () => { updatePill(); if(PL.ui) PL.ui(); };
  if(s.synth === "circus"){
    const st = startCircus(); if(st){ PL.stopFn = st; PL.playing = true; } else PL.failed = true;
  } else if(s.src){
    const a = new Audio(s.src); a.loop = true;
    PL.stopFn = () => { a.pause(); a.removeAttribute("src"); try{ a.load(); }catch(e){} };
    const fail = () => { if(PL.i === i && !PL.playing){ PL.failed = true; poke(); } };
    a.addEventListener("error", fail, {once:true});
    const p = a.play();
    if(p && p.then) p.then(() => { if(PL.i === i){ PL.playing = true; poke(); } }).catch(fail);
  } else PL.failed = true;
  poke();
}

function cardGrid(bg){
  const Wd = 28, Ht = 40, g = Array.from({length:Ht}, () => Array(Wd).fill(bg));
  for(let x=0;x<Wd;x++){ g[0][x] = "K"; g[Ht-1][x] = "K"; }
  for(let y=0;y<Ht;y++){ g[y][0] = "K"; g[y][Wd-1] = "K"; }
  [[0,0],[Wd-1,0],[0,Ht-1],[Wd-1,Ht-1]].forEach(([x,y]) => g[y][x] = ".");
  return g;
}
function stamp(g, bm, x0, y0, ch, flip, scale){
  const h = bm.length, w = bm[0].length, s = scale || 1;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    if(bm[j][i] === "X" || bm[j][i] === "1"){
      const jj = flip ? h-1-j : j, ii = flip ? w-1-i : i;
      for(let a=0;a<s;a++) for(let b=0;b<s;b++) g[y0 + jj*s + a][x0 + ii*s + b] = ch;
    }
  }
}
function cardFace(rank, suit){
  const g = cardGrid("W"), col = SUITS[suit].col, Wd = 28, Ht = 40, gl = GLYPH[rank === 1 ? "A" : String(rank)];
  stamp(g, gl, 2, 2, "K"); stamp(g, PIP5[suit], 1, 8, col);
  stamp(g, gl, Wd-5, Ht-7, "K", true); stamp(g, PIP5[suit], Wd-6, Ht-13, col, true);
  const L = 7, Cc = 12, R = 17, r1 = 6, r2 = 17, r3 = 28;
  const six = [[L,r1],[R,r1],[L,r2],[R,r2],[L,r3,1],[R,r3,1]];
  const lay = {2:[[Cc,r1],[Cc,r3,1]], 3:[[Cc,r1],[Cc,r2],[Cc,r3,1]], 4:[[L,r1],[R,r1],[L,r3,1],[R,r3,1]],
    5:[[L,r1],[R,r1],[Cc,r2],[L,r3,1],[R,r3,1]], 6:six, 7:six.concat([[Cc,11]]), 8:six.concat([[Cc,11],[Cc,23,1]])};
  if(rank === 1) stamp(g, PIP7[suit], 7, 13, col, false, 2);
  else lay[rank].forEach(p => stamp(g, PIP5[suit], p[0], p[1], col, !!p[2]));
  return g.map(r => r.join(""));
}
function cardBack(suit, bc){
  const g = cardGrid(bc), Wd = 28, Ht = 40;
  for(let y=3;y<Ht-3;y++) for(let x=3;x<Wd-3;x++) if((x + y) % 4 === 0) g[y][x] = "L";
  for(let x=2;x<Wd-2;x++){ g[2][x] = "W"; g[Ht-3][x] = "W"; }
  for(let y=2;y<Ht-2;y++){ g[y][2] = "W"; g[y][Wd-3] = "W"; }
  for(let y=14;y<26;y++) for(let x=9;x<19;x++) g[y][x] = bc;
  stamp(g, PIP7[suit], 10, 16, "W");
  return g.map(r => r.join(""));
}
function cardKeyFace(){
  const g = cardGrid("W");
  stamp(g, SPR.key.map(r => r.replace(/J/g,"X")), 4, 15, "Y", false, 2);
  [[5,6],[22,8],[6,30],[21,32],[13,4],[14,35]].forEach(([x,y]) => { g[y][x] = "Y"; g[y-1][x] = "J"; g[y+1][x] = "J"; g[y][x-1] = "J"; g[y][x+1] = "J"; });
  return g.map(r => r.join(""));
}

// original circus tune, synthesised in the browser
function startCircus(){
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
  const ctx = new AC(), master = ctx.createGain(); master.gain.value = .22; master.connect(ctx.destination);
  const mel = [76,76,79,76, 72,76,79,84, 83,81,79,77, 74,77,79,0, 76,76,79,76, 77,81,84,81, 83,79,74,79, 72,76,72,0];
  const roots = [48,48,43,43,48,41,43,48];
  const chords = [[60,64,67],[60,64,67],[59,62,67],[59,62,67],[60,64,67],[60,65,69],[59,62,67],[60,64,67]];
  const ei = .19, f = n => 440*Math.pow(2,(n-69)/12);
  const note = (type,n,t,d,v) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f(n);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
  };
  const bars = start => {
    for(let b=0;b<8;b++) for(let k=0;k<4;k++){
      const t = start + (b*4+k)*ei, m = mel[b*4+k];
      if(m){ note("square",m,t,ei*.9,.09); note("square",m+12,t,ei*.9,.03); }
      if(k%2===0) note("triangle",roots[b],t,ei*.9,.25); else chords[b].forEach(n => note("sawtooth",n,t,ei*.6,.05));
    }
    return start + 32*ei;
  };
  let next = bars(ctx.currentTime + .1);
  const iv = setInterval(() => { if(next - ctx.currentTime < 2) next = bars(next); }, 500);
  return () => { clearInterval(iv); try{ ctx.close(); }catch(e){} };
}

const seen = new Set();
function gen(){ const g = pick(GEN); return g.t.replace(/\{(\w+)\}/g, (_,k) => pick(g.s[k])); }
function fromList(list, size){
  const part = list.slice(0, size || list.length);
  let pool = part.filter(x => !seen.has(x));
  if(!pool.length){ part.forEach(x => seen.delete(x)); pool = part; }
  const t = pick(pool); seen.add(t); return t;
}
function drawQ(cat, ease){
  if(cat === "endless") return {t:gen(), cat:"endless"};
  if(cat === "surprise"){
    const pool = QCATS.filter(c => c.id!=="surprise" && !(c.lock && !unlocked()));
    return drawQ(pick(pool).id, ease);
  }
  const list = Q[cat];
  const size = ease ? Math.min(list.length, 3 + (S.byCat[cat]||0)) : list.length;
  return {t:fromList(list, size), cat};
}

/* ---------- the wandering cat ---------- */
function startCat(root){
  const CANCEL = {}, waiters = new Set(), tm = new Set();
  let alive = true, frameIv = null, lastSleep = "", next = null, annoyedUntil = 0, clicks = [];
  const T = (fn, ms) => { const id = setTimeout(() => { tm.delete(id); fn(); }, ms); tm.add(id); };
  const wait = ms => new Promise((res, rej) => { const w = {}; w.id = setTimeout(() => { waiters.delete(w); res(); }, ms); w.rej = rej; waiters.add(w); });
  const cancelAll = () => { waiters.forEach(w => { clearTimeout(w.id); w.rej(CANCEL); }); waiters.clear(); clearInterval(frameIv); };
  onLeave(() => { alive = false; cancelAll(); tm.forEach(clearTimeout); });

  const cat = document.createElement("button");
  cat.className = "wcat"; cat.setAttribute("aria-label", "The black cat");
  cat.innerHTML = `<span class="csp"></span><span class="bubble cb" aria-hidden="true"></span><span class="zz" aria-hidden="true">z</span>`;
  root.appendChild(cat);
  const csp = cat.querySelector(".csp"), cb = cat.querySelector(".cb"), zz = cat.querySelector(".zz");
  const FR = {sit:sprite(SPR.catSit,3), w0:sprite(SPR.catW0,3), w1:sprite(SPR.catW1,3), sleep:sprite(SPR.catSleep,3)};
  let x = 0, y = 0, facing = 1, pose = "sit";
  const setPose = p => { pose = p; csp.innerHTML = FR[p]; zz.style.display = p==="sleep" ? "block" : "none"; };
  const face = f => { facing = f; csp.style.transform = `scaleX(${f})`; };
  const place = (nx, ny, dur) => { x = nx; y = ny; cat.style.transitionDuration = dur + "s"; cat.style.transform = `translate(${nx}px,${ny}px)`; };
  const say = (t, ms) => { cb.textContent = t; cb.classList.add("on"); T(() => cb.classList.remove("on"), ms || 1600); };
  const W = 64, H = 56;

  const geo = el => { const rr = root.getBoundingClientRect(), r = el.getBoundingClientRect(); return {l:r.left-rr.left, t:r.top-rr.top, w:r.width, b:r.bottom-rr.top, r:r.right-rr.left}; };
  const clampX = v => Math.max(0, Math.min(root.clientWidth - W, v));
  const vis = n => { const e = root.querySelector(`[data-spot="${n}"]`); if(!e) return false; const r = e.getBoundingClientRect(); return r.bottom > -80 && r.top < innerHeight + 80; };
  const spot = name => {
    const e = root.querySelector(`[data-spot="${name}"]`); if(!e) return null; const g = geo(e);
    if(name==="door") return {x:clampX(g.r+4), y:g.b-H, look:-1, g};
    if(name==="mush") return {x:clampX(g.l-W+8), y:g.b-H, look:1, g};
    if(name==="cardsrow") return {x:clampX(g.r-W-10), y:g.b-H-3, look:-1, g};
    if(name==="sky") return {x:clampX(g.l + 8 + Math.random()*Math.max(8, g.w*.4-W)), y:g.t-H+5, look:1, g};
    return {x:clampX(g.l + g.w*.35 + Math.random()*Math.max(8, g.w*.65-W)), y:g.t-H+5, look:Math.random()<.5?1:-1, g};
  };
  const SIT = ["menu","more","sky"], SLEEP = ["sky","more","mush"];
  const near = list => { const v = list.filter(vis); return pick(v.length ? v : list); };

  const walk = async t => {
    const dx = t.x - x, dy = t.y - y, dist = Math.hypot(dx, dy);
    if(dist < 6) return;
    if(Math.abs(dx) > 6) face(dx > 0 ? 1 : -1);
    const dur = Math.min(Math.max(dist/95, .6), 9);
    let f = 0; setPose("w0"); clearInterval(frameIv);
    frameIv = setInterval(() => setPose(++f % 2 ? "w1" : "w0"), 220);
    place(t.x, t.y, dur);
    await wait(dur*1000 + 60);
    clearInterval(frameIv); setPose("sit");
  };
  const sitAt = async (name, ms, talk) => { const s = spot(name); if(!s) return; await walk(s); face(s.look); setPose("sit"); if(talk) say(talk, 1800); await wait(ms); };
  const sleepAt = async name => {
    const s = spot(name); if(!s) return; await walk(s); face(s.look); setPose("sleep"); lastSleep = name;
    await wait(12000 + Math.random()*8000); setPose("sit"); say("mrrp", 1200); await wait(900);
  };
  const lead = async () => {
    if(S.key && !S.doorOpen){
      const s = spot("door"); await walk(s); face(s.look); setPose("sit");
      for(let i=0; i<4 && alive && !S.doorOpen; i++){ say("mrrp!", 1500); await wait(3500); }
      return true;
    }
    if(!S.key && (S.flips||0) >= Math.floor(CONFIG.keyAfterFlips/2)){
      const s = spot("cardsrow"); await walk(s); face(s.look); setPose("sit"); say("?", 1800); await wait(6500); return true;
    }
    return false;
  };
  const choose = async () => {
    const r = Math.random();
    if(r < .25 && await lead()) return;
    if(r < .5 && vis("door")){ const s = spot("door"); await walk(s); face(s.look); setPose("sit"); say(S.key ? "!" : "?", 1600); await wait(5000 + Math.random()*3000); return; }
    if(r < .75){ const v = SLEEP.filter(n => n !== lastSleep && vis(n)); if(v.length){ await sleepAt(pick(v)); return; } }
    await sitAt(near(SIT), 4000 + Math.random()*4000);
  };
  const flee = async () => {
    const far = SLEEP.filter(n => n !== lastSleep); await sleepAt(pick(far));
  };

  cat.addEventListener("click", () => {
    const now = Date.now(); clicks = clicks.filter(t => now - t < 8000); clicks.push(now);
    if(now < annoyedUntil){ say("hiss", 1200); return; }
    if(clicks.length >= 5){
      annoyedUntil = now + 25000; clicks = []; say("hmph.", 2200); award("cat"); face(-facing);
      if(!REDUCE){ next = flee; cancelAll(); }
      return;
    }
    petFX(cat, 4);
    if(pose === "sleep"){ setPose("sit"); say("mrrp?", 1400); cancelAll(); } else say(pick(["purr","mrrp","prrr"]), 1200);
  });

  const s0 = spot("menu");
  setPose("sit"); face(1); place(s0.x, s0.y, 0);
  if(REDUCE) return;
  (async () => {
    try{ await wait(1500); }catch(e){}
    while(alive){
      try{
        if(document.hidden){ await wait(1500); continue; }
        if(next){ const n = next; next = null; await n(); } else await choose();
        await wait(1200 + Math.random()*2500);
      }catch(e){ if(e !== CANCEL) throw e; }
    }
  })();
}

/* ---------- how well do you know me (pass the phone) ---------- */
function quiz(el){
  const L = ["A","B","C","D"];
  const seenQ = new Set();
  let asker = 0, scores = [0,0], cur = null, truth = null;
  const N = () => CONFIG.names;
  const board = () => `<div class="score" aria-label="Score">${N().map((n,i) => `<span class="${i===asker?"on":""}">${esc(n)} ${scores[i]}</span>`).join("")}</div>`;
  const newQ = () => {
    let pool = QUIZ_BANK.filter(x => !seenQ.has(x.q)); if(!pool.length){ seenQ.clear(); pool = QUIZ_BANK; }
    const q = pick(pool); seenQ.add(q.q);
    cur = {q:q.q, o:shuffle(q.pool).slice(0,4)};
  };
  const opts = (cls) => `<div class="opts">${cur.o.map((o,k) => `<button class="opt ${cls||""}" data-k="${k}"><i>${L[k]}</i><span>${esc(o)}</span></button>`).join("")}</div>`;

  const setup = () => {
    el.innerHTML = `
      <div class="step">Who answers first?</div>
      <div class="two">${N().map((n,i) => `<button class="btn ${i?"alt":""}" data-w="${i}" style="min-height:72px">${esc(n)}</button>`).join("")}</div>`;
    el.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { asker = +b.dataset.w; scores = [0,0]; newQ(); answerScreen(); });
  };
  const answerScreen = () => {
    const a = N()[asker], g = N()[1-asker];
    el.innerHTML = `${board()}
      <div class="panel"><span class="tab">${esc(a)} answers</span><p class="big">${esc(cur.q)}</p><p class="sub">${esc(a)}, answer honestly about yourself. ${esc(g)}, look away.</p></div>
      ${opts()}`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => { truth = +b.dataset.k; passScreen(); });
  };
  const passScreen = () => {
    const g = N()[1-asker];
    el.innerHTML = `${board()}
      <div class="panel"><span class="tab">Locked in</span><p class="big">Now pass the phone to your partner to see if you got it right.</p></div>
      <div class="actions"><button class="btn" id="rdy">${esc(g)} is ready</button></div>`;
    $("#rdy").onclick = guessScreen;
  };
  const guessScreen = () => {
    const a = N()[asker], g = N()[1-asker];
    el.innerHTML = `${board()}
      <div class="panel"><span class="tab">${esc(g)} guesses</span><p class="big">${esc(cur.q)}</p><p class="sub">${esc(g)}, what did ${esc(a)} pick?</p></div>
      ${opts()}`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => reveal(+b.dataset.k));
  };
  const reveal = guess => {
    const a = N()[asker], g = N()[1-asker], ok = guess === truth;
    if(ok) scores[1-asker]++;
    el.innerHTML = `${board()}
      <div class="panel"><span class="tab">Result</span>
        <p class="sub" style="margin:0 0 10px">${esc(cur.q)}</p>
        <p class="verdict">${ok ? "Right" : "Wrong"}</p>
        <p style="margin:0 0 8px;font-weight:600">${esc(pick(ok ? RIGHT_LINES : WRONG_LINES))}</p>
        <p style="margin:0">${esc(a)} picked <b>${L[truth]}: ${esc(cur.o[truth])}</b>.${ok ? "" : ` ${esc(g)} guessed ${L[guess]}: ${esc(cur.o[guess])}.`}</p>
      </div>
      <div class="actions"><button class="btn" id="nq">Next question, swap roles</button><button class="btn ghost" id="end">End game</button></div>`;
    $("#nq").onclick = () => { asker = 1-asker; newQ(); answerScreen(); };
    $("#end").onclick = finish;
  };
  const finish = () => {
    const [x,y] = scores;
    const msg = x===y ? "A tie. Suspicious." : `${N()[x>y?0:1]} knows ${N()[x>y?1:0]} better.`;
    el.innerHTML = `
      <div class="panel"><span class="tab">Final score</span><p class="big">${esc(N()[0])} ${x}, ${esc(N()[1])} ${y}</p><p class="sub">${esc(msg)}</p></div>
      <div class="actions"><button class="btn" id="again">Play again</button></div>`;
    $("#again").onclick = setup;
  };
  setup();
}

/* ---------- heads up ---------- */
function headsup(el){
  let cat = "anime", len = 60;
  const menu = () => {
    el.innerHTML = `
      <div class="step">Category</div>
      <div class="row" id="hc" role="group" aria-label="Category">${Object.entries(HEADS).map(([id,c]) => `<button class="chip" data-c="${id}" aria-pressed="${id===cat}">${esc(c.n)}</button>`).join("")}</div>
      <div class="step">Time</div>
      <div class="row" id="hl" role="group" aria-label="Time">${[30,60,90].map(s => `<button class="chip" data-l="${s}" aria-pressed="${s===len}">${s} sec</button>`).join("")}</div>
      <div class="actions"><button class="btn xl" id="go">Start</button></div>`;
    $("#hc").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; cat = b.dataset.c; $("#hc").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x===b)); };
    $("#hl").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; len = +b.dataset.l; $("#hl").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x===b)); };
    $("#go").onclick = countdown;
  };
  const countdown = () => {
    let n = 3;
    el.innerHTML = `<p class="lead" style="text-align:center">Phone to your forehead. Screen facing your partner.</p><div class="count" id="c">${n}</div>`;
    const iv = setInterval(() => { n--; if(n<=0){ clearInterval(iv); play(); } else $("#c").textContent = n; }, 1000);
    onLeave(() => clearInterval(iv));
  };
  const play = () => {
    let words = shuffle(HEADS[cat].w), wi = 0, left = len; const got = [], passed = [];
    el.innerHTML = `
      <div class="hu-top"><span>Time <b id="t">${left}</b></span><span>Score <b id="s">0</b></span></div>
      <div class="hu-word" id="w"></div>
      <div class="hu-btns"><button class="btn ghost" id="pass">Pass</button><button class="btn alt" id="got">Got it</button></div>`;
    const w = $("#w");
    const show = () => { if(wi >= words.length){ words = shuffle(HEADS[cat].w); wi = 0; } w.textContent = words[wi]; };
    const flash = ok => { w.classList.toggle("ok", ok); try{ navigator.vibrate && navigator.vibrate(ok?40:[20,40,20]); }catch(e){} };
    const gotIt = () => { got.push(words[wi]); wi++; $("#s").textContent = got.length; flash(true); show(); };
    const passIt = () => { passed.push(words[wi]); wi++; flash(false); show(); };
    $("#got").onclick = gotIt; $("#pass").onclick = passIt;
    const key = e => { if(e.key==="ArrowRight"||e.key==="Enter"){ gotIt(); } else if(e.key==="ArrowLeft"||e.key===" "){ e.preventDefault(); passIt(); } };
    document.addEventListener("keydown", key);
    const iv = setInterval(() => { left--; $("#t").textContent = left; if(left<=0) end(); }, 1000);
    const end = () => { clearInterval(iv); document.removeEventListener("keydown", key); summary(got, passed); };
    onLeave(() => { clearInterval(iv); document.removeEventListener("keydown", key); });
    show();
  };
  const summary = (got, passed) => {
    el.innerHTML = `
      <div class="panel"><span class="tab">Time's up</span><p class="big">${got.length} correct</p></div>
      <div class="two-col">
        <div><div class="step" style="margin-top:0">Got it</div><ul>${got.map(x => `<li>${esc(x)}</li>`).join("") || "<li>None</li>"}</ul></div>
        <div><div class="step" style="margin-top:0">Passed</div><ul>${passed.map(x => `<li>${esc(x)}</li>`).join("") || "<li>None</li>"}</ul></div>
      </div>
      <div class="actions"><button class="btn" id="again">Play again</button><button class="btn ghost" id="chg">Change category</button></div>`;
    $("#again").onclick = countdown; $("#chg").onclick = menu;
  };
  menu();
}

/* ---------- quizzes (two players, alternating, randomised) ---------- */
const offeredQ = new Set(), doneQ = new Set();
function fantasy(el){
  const N = CONFIG.names, L = ["A","B","C","D"];
  let quiz = null, idx = -1, qi = 0, turn = 0, picks = [[],[]], offer = [];
  const draw = () => {
    let pool = FANTASY.map((_,i) => i).filter(i => !offeredQ.has(i));
    if(pool.length < 4){ offeredQ.clear(); pool = FANTASY.map((_,i) => i); }
    offer = shuffle(pool).slice(0,4); offer.forEach(i => offeredQ.add(i));
  };
  const menu = () => {
    if(!offer.length) draw();
    el.innerHTML = `
      <div class="actions" style="flex-direction:column;align-items:stretch;margin-top:8px">${offer.map((i,k) => `<button class="btn ${k%2?"alt":""}" data-q="${i}" style="min-height:64px;text-align:left">${esc(FANTASY[i].title)}${doneQ.has(i) ? " (done)" : ""}</button>`).join("")}</div>
      <div class="actions"><button class="btn ghost" id="fresh">New quizzes</button></div>`;
    el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => start(+b.dataset.q));
    $("#fresh").onclick = () => { draw(); menu(); };
  };
  const start = i => {
    idx = i; const q0 = FANTASY[i];
    quiz = {title:q0.title, results:q0.results, questions:shuffle(q0.questions).map(q => ({q:q.q, o:shuffle(q.o)}))};
    qi = 0; turn = 0; picks = [[],[]]; ask();
  };
  const ask = () => {
    const q = quiz.questions[qi];
    el.innerHTML = `
      <div class="score"><span class="on">${esc(N[turn])}'s turn</span><span>Question ${qi+1} of ${quiz.questions.length}</span></div>
      <div class="panel"><span class="tab">${esc(N[turn])} answers</span><p class="big">${esc(q.q)}</p></div>
      <div class="opts">${q.o.map((o,k) => `<button class="opt" data-k="${k}"><i>${L[k]}</i><span>${esc(o[0])}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      picks[turn].push(q.o[+b.dataset.k][1]);
      if(turn === 0){ turn = 1; ask(); }
      else { turn = 0; qi++; if(qi >= quiz.questions.length) results(); else ask(); }
    });
    window.scrollTo(0,0);
  };
  const outcome = p => {
    const sc = Array(quiz.results.length).fill(0); picks[p].forEach(r => sc[r]++);
    const max = Math.max(...sc), top = sc.map((s,i) => s===max ? i : -1).filter(i => i >= 0);
    return top[Math.floor(Math.random()*top.length)];
  };
  const results = () => {
    const a = outcome(0), b = outcome(1);
    S.fq = (S.fq||0) + 1; save(); doneQ.add(idx);
    el.innerHTML = `
      <p class="lead">${esc(quiz.title)}</p>
      ${[a,b].map((r,p) => `<div class="panel res"><span class="tab">${esc(N[p])}</span><h3>${esc(quiz.results[r].n)}</h3><p>${esc(quiz.results[r].d)}</p></div>`).join("")}
      ${a===b ? `<p class="lead">Same result. Of course.</p>` : ""}
      <div class="actions"><button class="btn" id="again">More quizzes</button><button class="btn ghost" id="redo">Take this one again</button></div>`;
    $("#again").onclick = menu;
    $("#redo").onclick = () => start(idx);
    window.scrollTo(0,0);
  };
  menu();
}

/* ---------- the door ---------- */
function door(el){
  if(!S.key){ location.hash = "#/"; toast("It's locked. You need the key."); return; }
  document.body.classList.add("hush");
  onLeave(() => document.body.classList.remove("hush"));
  S.doorOpen = true; save(); award("door");
  const D = CONFIG.door;
  el.innerHTML = `<div class="hushpage"><div class="hl hbtns">${D.video ? `<button class="hlink" id="rewatch">Watch again</button>` : ""}<a class="hback" href="#/">Go back</a></div></div>`;
  if(D.video){
    $("#rewatch").onclick = () => videoPopup(D.video);
    const vt = setTimeout(() => videoPopup(D.video), 400);
    onLeave(() => clearTimeout(vt));
  }
}

/* ---------- do something together ---------- */
function together(el){
  el.innerHTML = `
    <div class="tcard"><span class="tab">Movie or show</span><button class="btn" id="mv">Give us three</button><ul class="result" id="mvo"></ul></div>
    <div class="tcard"><span class="tab">Pick our food</span><button class="btn" id="fd">Decide for us</button><ul class="result" id="fdo"></ul></div>
    <div class="tcard"><span class="tab">Pick a place</span><button class="btn" id="pl">Surprise us</button><ul class="result" id="plo"></ul></div>
    <div class="tcard"><span class="tab">Pick an activity</span><button class="btn" id="ac">Pick one</button><ul class="result" id="aco"></ul></div>
    <div class="tcard"><span class="tab">10-minute conversation</span>
      <p id="tq" style="margin:0;font-weight:700">Press New question, then start the clock.</p>
      <div id="tmh"></div>
      <div class="actions"><button class="btn ghost" id="tr">New question</button></div>
    </div>`;
  const li = t => `<li>${esc(t)}</li>`;
  $("#mv").onclick = () => { $("#mvo").innerHTML = shuffle(CONFIG.movies).slice(0,3).map(m => `<li>${esc(m[0])}<small>${esc(m[1])}</small></li>`).join(""); $("#mv").textContent = "Give us three more"; };
  $("#fd").onclick = () => { $("#fdo").innerHTML = li(pick(CONFIG.foods)); $("#fd").textContent = "Try again"; };
  $("#pl").onclick = () => { $("#plo").innerHTML = li(pick(CONFIG.places)); $("#pl").textContent = "Try again"; };
  $("#ac").onclick = () => { const a = pick(CONFIG.activities).replace("{A}", nameA).replace("{B}", nameB); $("#aco").innerHTML = `<li class="${a.length<=3?"emo":""}">${esc(a)}</li>`; $("#ac").textContent = "Pick another"; };
  const tm = timerUI($("#tmh"), 600, "Time's up. Keep talking if you don't want to stop.");
  $("#tr").onclick = () => { $("#tq").textContent = drawQ("surprise", false).t; tm.reset(); };
}

/* ---------- record player ---------- */
function records(el){
  el.innerHTML = `
    <p class="lead">Pick a song. It keeps playing while you explore, until you stop the record.</p>
    <div class="gwrap"><div class="gs" id="gs">${sprite(SPR.gramo,7)}<span class="spin"></span><span id="notes"></span></div></div>
    <p class="now" id="now">Pick a song.</p>
    <div class="actions gact" id="gact"></div>
    <ul class="tracks" id="tracks">${CONFIG.songs.map((s,i) => `<li><button class="track" data-i="${i}"><span class="tn">${i+1}</span><span class="tt">${esc(s.t)}${s.by ? `<small>${esc(s.by)}</small>` : ""}</span></button></li>`).join("")}</ul>`;
  const gs = $("#gs"), notes = $("#notes"), now = $("#now"), gact = $("#gact");
  let noteIv = null;
  const links = s => {
    const q = encodeURIComponent(s.q || s.t);
    return `<a class="btn ghost" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=${q}">Open on YouTube</a><a class="btn ghost" target="_blank" rel="noopener noreferrer" href="https://open.spotify.com/search/${q}">Open on Spotify</a>`;
  };
  const render = () => {
    const on = PL.i >= 0, s = on ? CONFIG.songs[PL.i] : null;
    gs.classList.toggle("on", on);
    el.querySelectorAll(".track").forEach((t,k) => t.classList.toggle("on", k === PL.i));
    now.textContent = on ? "Now spinning: " + s.t : "Pick a song.";
    gact.innerHTML = on ? `<button class="btn" id="gstop">Stop the record</button>${PL.failed && !s.synth ? links(s) : ""}` : "";
    if(on) $("#gstop").onclick = stopSong;
    if(on && !REDUCE && !noteIv){
      noteIv = setInterval(() => {
        const n = document.createElement("span"); n.className = "nt"; n.innerHTML = sprite(SPR.note,3);
        n.style.setProperty("--dx", (-10 - Math.random()*40) + "px"); notes.appendChild(n); setTimeout(() => n.remove(), 2000);
      }, 700);
    }
    if(!on){ clearInterval(noteIv); noteIv = null; }
  };
  PL.ui = render;
  onLeave(() => { PL.ui = null; clearInterval(noteIv); });
  $("#tracks").addEventListener("click", e => { const b = e.target.closest(".track"); if(!b) return; playSong(+b.dataset.i); });
  render();
}

/* ---------- the witch's hut ---------- */
function hut(el){
  el.innerHTML = `
    <div class="scene">${sprite(SPR.hut, 10)}</div>

    <section class="panel"><span class="tab">Tarot</span>
      <p style="margin:0">Take a breath, think of something, then pull a card. Just for fun.</p>
      <div class="tarot-wrap" id="tw"></div>
      <div id="tmean"></div>
      <div class="actions"><button class="btn" id="pull">Pull a card</button></div>
    </section>

    <section class="panel"><span class="tab">Magic eight ball</span>
      <p style="margin:0">Think of a yes or no question, then shake.</p>
      <div class="ball eight" id="ball"><div class="win" id="bw">8</div></div>
      <p class="big" id="ba" style="text-align:center;min-height:2.4em"></p>
      <div class="actions" style="justify-content:center"><button class="btn alt" id="shake">Shake</button></div>
    </section>
`;

  // tarot
  let lastTarot = -1;
  $("#pull").onclick = () => {
    let i; do { i = Math.floor(Math.random()*TAROT.length); } while(i === lastTarot); lastTarot = i;
    const c = TAROT[i], rev = Math.random() < .3;
    $("#tw").innerHTML = `<div class="t3 ${rev?"rev":""}" id="t3"><span class="in"><span class="face back">${sprite(SPR.icons.eye, 6).replace(/fill="#3A1F80"/g,'fill="#F4EEFF"')}</span><span class="face front"><span class="num">${c[0]}</span><span class="art">${tarotSVG(i,170)}</span><span class="nm">${esc(c[1])}</span></span></span></div>`;
    $("#tmean").innerHTML = "";
    requestAnimationFrame(() => requestAnimationFrame(() => $("#t3").classList.add("flipped")));
    setTimeout(() => {
      $("#tmean").innerHTML = `<p class="big" style="text-align:center;font-size:1.5rem">${esc(c[1])}${rev?` <span class="rev-tag">Reversed</span>`:""}</p><p style="text-align:center;margin:8px 0 0">${esc(rev ? c[4] : c[3])}</p>`;
    }, REDUCE ? 0 : 700);
    $("#pull").textContent = "Pull another";
  };

  // eight ball
  $("#shake").onclick = () => {
    const ball = $("#ball"); ball.classList.remove("shake"); void ball.offsetWidth; ball.classList.add("shake");
    ball.classList.remove("eight"); $("#bw").textContent = "..."; $("#ba").textContent = "";
    setTimeout(() => { const [tag,text] = pick(EIGHT); $("#bw").textContent = tag; $("#ba").textContent = text; }, REDUCE ? 0 : 700);
  };

}

/* ---------- random ---------- */
function random(el){
  const one = () => {
    const locked = !unlocked();
    const kinds = [
      () => ({k:"Question", t:drawQ("surprise", false).t}),
      () => ({k:"Truth", t:pick(TRUTHS[pick(TYPES.filter(x => !(locked && x[0]==="flirty")))[0]])}),
      () => ({k:"Dare", t:pick(DARES[pick(TYPES.filter(x => !(locked && x[0]==="flirty")))[0]])}),
      () => { const d = pick(DECKS.filter(x => !(locked && x.lock))); return {k:"Card, " + d.n, t:pick(d.cards)}; },
      () => ({k:"Chaos", t:pick(CHAOS)})
    ];
    return pick(kinds)();
  };
  const show = () => {
    const r = one();
    el.innerHTML = `<p class="lead">No choices. Whatever comes up, comes up.</p>
      <div class="panel"><span class="tab">${esc(r.k)}</span><p class="big">${esc(r.t)}</p></div>
      <div class="actions"><button class="btn" id="ag">Again</button></div>`;
    $("#ag").onclick = show;
  };
  show();
}

/* ---------- letters ---------- */
function letters(el){
  const all = CONFIG.letters.concat([Object.assign({locked:true}, CONFIG.lockedLetter)]);
  el.innerHTML = `<p class="lead">Each one is for a different kind of day.</p><div class="env-grid">${
    all.map((l,i) => `<button class="env ${l.locked?"lock":""} ${S.opened.includes(i)?"opened":""}" data-i="${i}"><span>${esc(l.t)}</span></button>`).join("")
  }</div>`;
  el.querySelector(".env-grid").addEventListener("click", e => {
    const b = e.target.closest(".env"); if(!b) return;
    const i = +b.dataset.i, l = all[i];
    if(l.locked){
      const when = anniversary();
      if(Date.now() < when.getTime()){
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        const n = Math.ceil((when - Date.now())/864e5);
        toast(`Not yet. Opens on ${fmtDate(when)}, in ${n} day${n===1?"":"s"}.`);
        return;
      }
    }
    if(!S.opened.includes(i)){ S.opened.push(i); save(); b.classList.add("opened"); }
    dialog(l.t, l.x);
  });
}

/* ---------- stats ---------- */
function stats(el){
  const rows = [
    ["Days together", days()],
    ["Questions answered", S.answered],
    ["Truths survived", S.truths],
    ["Dares completed", S.dares],
    ["Cards kept", S.kept.length],
    ["Letters opened", S.opened.length],
    ["Fantasy quizzes finished", S.fq || 0],
    ["Achievements", Object.keys(S.ach).length + " / " + Object.keys(ACH).length]
  ];
  el.innerHTML = `
    <p class="lead">Numbers that don't matter, kept very carefully.</p>
    <ul class="ledger">
      ${rows.map(r => `<li><span>${esc(r[0])}</span><b>${esc(r[1])}</b></li>`).join("")}
      ${CONFIG.silly.map(r => `<li><span>${esc(r.l)}</span><b>${esc(r.v)}</b></li>`).join("")}
      <li class="tap" id="adm"><span>${esc(CONFIG.admitted.l)}</span><b id="admv">${esc(CONFIG.admitted.v)}</b></li>
    </ul>
    <button class="reset" id="rs">Reset our counts</button>`;
  let taps = 0;
  $("#adm").addEventListener("click", () => { taps++; if(taps >= 3){ $("#admv").textContent = CONFIG.admitted.secret; burst(); } });
  $("#rs").onclick = () => { if(confirm("Reset all counts, kept cards and opened letters on this device?")){ S = fresh(); save(); stats(el); } };
}

route();
</script>
